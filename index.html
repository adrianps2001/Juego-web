<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juego Web</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <div id="menu" class="panel">
      <h1>Juego Web 3D</h1>
      <label>Tu nombre <input id="name" maxlength="16" placeholder="Jugador" /></label>
      <button id="host">Crear sala</button>
      <div class="sep">o únete a una</div>
      <div class="row">
        <input id="code" maxlength="5" placeholder="CÓDIGO" />
        <button id="join">Unirse</button>
      </div>
      <p id="status"></p>
    </div>

    <div id="hud" hidden>
      <div class="panel small">
        <div>Sala: <b id="room"></b> <button id="copy">Copiar enlace</button></div>
        <ul id="players"></ul>
        <button id="leave">Salir</button>
      </div>
      <div class="help">Clic para mover la cámara con el ratón · WASD moverse · Espacio saltar · Esc soltar el ratón</div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
